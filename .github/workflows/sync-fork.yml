name: Sync Fork 24/7

on:
  schedule:
    # كل يوم الساعة 3 الفجر UTC = 5 الفجر بتوقيت القاهرة
    - cron: '0 3 * * *'
  workflow_dispatch: # تقدر تشغله يدوي من صفحة Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: Mustafa700aa/EdgeSync
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # ده اللي هيمنع الـ workflow يفشل لو فيه commits محلية
          test_mode: false
