name: Sync with Fork 24/7

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo (Temp)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN_V3 }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add fork remote
        run: |
          git remote add upstream https://x-access-token:${{ secrets.SYNC_TOKEN_V3 }}@github.com/Ahmed-Tariq-197/EdgeSync.git

      - name: Fetch fork (all branches)
        run: git fetch upstream --prune

      - name: Mirror main (merge, not reset)
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git push origin main

      - name: Sync all other branches
        run: |
          for branch in $(git branch -r | grep 'upstream/' | grep -v HEAD | sed 's|upstream/||' | tr -d ' '); do
            if [ "$branch" != "main" ]; then
              echo "Syncing branch: $branch"
              git checkout -B "$branch" "upstream/$branch"
              git push origin "$branch" --force
            fi
          done
