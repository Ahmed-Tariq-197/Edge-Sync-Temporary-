# EdgeSync Coordination & P2P Protocol Parameters
# ZERO-HARDCODING MANDATE: All state machine parameters, weights, and timeouts injected from YAML.

coordination_params:
  ros__parameters:
    robot_id: "ugv_1"
    is_initial_owner: true
    protocol_version: 0x0203

    # Protocol Timers & Cutoffs (Master Plan v1.0 Appendix)
    dt_dec_ms: 20
    dt_neg_ms: 60
    t_neg_timeout_ms: 80
    dt_acq_ms: 600
    t_acq_cutoff_ms: 700
    t_txn_ms: 886
    t_ack_ms: 100
    t_claim_ms: 200

    # Liveness Watchdog Configuration
    watchdog_period_ms: 100
    watchdog_max_missed: 3

    # Retries and Bursts
    confirm_retry_count: 3
    confirm_retry_period_ms: 30
    owner_claim_burst: 3
    owner_claim_burst_period_ms: 20

    # Eligibility & Utility Parameters
    candidate_gate_cpu_max_pct: 90.0
    candidate_gate_battery_min_pct: 15.0
    peer_telemetry_max_age_ms: 2500.0
    utility_weight_feasibility: 0.50
    utility_weight_fov: 0.30
    utility_weight_network: 0.20
